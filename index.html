<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Task Board</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;font-size:13px;background:#f6f5f2;color:#1c1b18;min-height:100vh}
.screen{display:none}.screen.active{display:block}
.hw{max-width:900px;margin:0 auto;padding:2rem 1rem 3rem}
.hh{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:10px}
.brand{font-size:18px;font-weight:600}.brand-sub{font-size:10px;color:#a8a49c;margin-top:2px}
.conn-badge{font-size:10px;padding:2px 8px;border-radius:99px;font-weight:500;display:inline-block;margin-top:3px}
.conn-badge.ok{background:#e8f4ee;color:#2a6b4a}
.conn-badge.err{background:#fcecea;color:#c0392b}
.conn-badge.loading{background:#f0efe9;color:#a8a49c}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.pcard{background:#fff;border:1px solid #e4e2da;border-radius:12px;padding:1rem;cursor:pointer;transition:all .2s;position:relative}
.pcard:hover{box-shadow:0 4px 12px rgba(0,0,0,.1);transform:translateY(-1px)}
.pbar{height:4px;border-radius:2px;margin-bottom:10px}
.pname{font-size:13px;font-weight:600;margin-bottom:3px}
.pdesc{font-size:11px;color:#a8a49c;margin-bottom:10px;line-height:1.4;min-height:14px}
.pmeta{display:flex;gap:8px;flex-wrap:wrap}
.pst{font-size:10px;color:#a8a49c;display:flex;align-items:center;gap:3px}
.pdot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.pmenu{position:absolute;top:8px;right:8px;background:none;border:none;cursor:pointer;color:#a8a49c;font-size:14px;padding:2px 6px;border-radius:5px;opacity:0}
.pcard:hover .pmenu{opacity:1}.pmenu:hover{background:#f0efe9}
.newpcard{background:none;border:1.5px dashed #d0cec5;border-radius:12px;padding:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;color:#a8a49c;font-size:12px;min-height:100px;transition:all .2s}
.newpcard:hover{border-color:#6b6960;color:#6b6960;background:#fff}
.btn{border:none;border-radius:8px;padding:6px 13px;cursor:pointer;font-family:inherit;font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:5px}
.btn-p{background:#1c1b18;color:#fff}.btn-p:hover{background:#333}
.btn-g{background:#fff;border:1px solid #d0cec5;color:#6b6960}.btn-g:hover{background:#f0efe9}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-start;justify-content:center;padding-top:60px;z-index:200}
.modal{background:#fff;border-radius:12px;padding:1.25rem;width:350px;max-width:95vw;max-height:82vh;overflow-y:auto;box-shadow:0 16px 48px rgba(0,0,0,.15)}
.mtitle{font-size:14px;font-weight:600;margin-bottom:1rem}
.field{margin-bottom:11px}
.field label{font-size:10px;color:#a8a49c;display:block;margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.field input,.field select,.field textarea{width:100%;font-size:13px;padding:7px 10px;border:1px solid #e4e2da;border-radius:8px;background:#fff;color:#1c1b18;outline:none;font-family:inherit}
.field input:focus,.field select:focus{border-color:#2355b0}
.field textarea{resize:vertical;min-height:52px}
.cpick{display:flex;gap:7px;flex-wrap:wrap;margin-top:4px}
.csw{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .15s}
.csw.sel{border-color:#1c1b18;transform:scale(1.15)}
.mfoot{display:flex;gap:7px;justify-content:flex-end;margin-top:1rem;padding-top:1rem;border-top:1px solid #e4e2da;align-items:center}
.mfoot button{font-size:12px;padding:6px 14px;border-radius:8px;cursor:pointer;font-family:inherit;font-weight:500;border:none}
.mfp{background:#1c1b18;color:#fff}.mfp:hover{background:#333}
.mfg{border:1px solid #d0cec5!important;background:none;color:#6b6960}.mfg:hover{background:#f0efe9}
.mfd{border:1px solid #c0392b!important;background:none;color:#c0392b;margin-right:auto}.mfd:hover{background:#fcecea}
.cpanel{background:#fcecea;border:1px solid #f5c6c2;border-radius:8px;padding:10px 12px;margin-top:10px}
.cpanel p{font-size:12px;color:#c0392b;margin-bottom:8px;line-height:1.5}
.crow{display:flex;gap:6px}
.crow button{font-size:12px;padding:5px 12px;border-radius:7px;cursor:pointer;font-family:inherit;font-weight:500;border:none}
.cdel{background:#c0392b;color:#fff}.ccan{border:1px solid #d0cec5!important;background:none;color:#6b6960}
.bw{max-width:1100px;margin:0 auto;padding:1rem 1rem 3rem}
.btop{display:flex;align-items:center;gap:7px;margin-bottom:1rem;flex-wrap:wrap}
.backbtn{background:#fff;border:1px solid #d0cec5;border-radius:8px;padding:5px 11px;cursor:pointer;color:#6b6960;font-size:12px;font-weight:500;font-family:inherit}
.backbtn:hover{background:#f0efe9}
.bpname{font-size:14px;font-weight:600;display:flex;align-items:center;gap:7px;flex:1}
.pcdot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.savebtn{border:none;border-radius:8px;padding:5px 13px;cursor:pointer;display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;font-family:inherit}
.savebtn.uns{background:#1c1b18;color:#fff}
.savebtn.sav{background:none;border:1px solid #2a6b4a;color:#2a6b4a;font-weight:500}
.savebtn:disabled{opacity:.35;cursor:not-allowed}
.udot{width:7px;height:7px;border-radius:50%;background:#c97b1a;flex-shrink:0}
.sbar{font-size:10px;color:#a8a49c;text-align:right;margin-bottom:6px;min-height:14px}
.mets{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:1rem}
.met{background:#fff;border-radius:9px;padding:9px 10px;text-align:center;border:1px solid #e4e2da}
.mnum{font-size:18px;font-weight:600}.mlbl{font-size:10px;color:#a8a49c;margin-top:2px}
.pwrap{margin-bottom:1rem}
.pbar2{height:5px;background:#f0efe9;border-radius:3px;overflow:hidden}
.pfill{height:100%;background:#2a6b4a;border-radius:3px;transition:width .4s}
.plbl{font-size:11px;color:#a8a49c;margin-bottom:4px;display:flex;justify-content:space-between}
.tabs{display:flex;gap:4px;margin-bottom:1rem}
.tab{font-size:12px;padding:5px 14px;border-radius:8px;border:1px solid transparent;cursor:pointer;background:none;color:#a8a49c;font-weight:500;font-family:inherit}
.tab.act{background:#fff;color:#1c1b18;border-color:#e4e2da}
.fbar{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:.75rem}
.fc{font-size:11px;padding:2px 9px;border-radius:99px;border:1px solid #e4e2da;background:#fff;cursor:pointer;color:#6b6960;font-family:inherit}
.fc.act{background:#1c1b18;color:#fff;border-color:#1c1b18}
.bwrap2{display:flex;flex-direction:column;gap:9px}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;align-items:start}
.col{background:#f0efe9;border-radius:11px;padding:9px;min-height:120px;transition:background .2s,border .2s;border:2px solid transparent}
.col.dov{background:#e8f0ff;border:2px dashed #5b8dee}
.colh{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;padding:0 2px}
.coltit{font-size:12px;font-weight:600;display:flex;align-items:center;gap:5px}
.colcnt{font-size:10px;background:#fff;border:1px solid #e4e2da;border-radius:99px;padding:1px 6px;color:#a8a49c}
.coldl{font-size:10px;color:#5b8dee;text-align:center;padding:3px 0;display:none}
.col.dov .coldl{display:block}
.card{background:#fff;border:1px solid #e4e2da;border-radius:9px;padding:8px 10px;margin-bottom:5px;cursor:grab;transition:border-color .15s,opacity .15s,box-shadow .15s;user-select:none}
.card:hover{border-color:#d0cec5;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.card.drag{opacity:.3}.card.cdov{border:2px dashed #5b8dee;background:#f0f5ff}
.card.od{border-left:3px solid #c0392b;border-radius:0 9px 9px 0}
.card.pen{border-color:#c97b1a}
.cname{font-size:12px;font-weight:500;line-height:1.4;margin-bottom:4px;word-break:break-word}
.csubs{margin:5px 0 4px;padding-left:2px}
.srow{display:flex;align-items:center;gap:5px;padding:2px 0;border-radius:4px}
.srow.sdov{background:#eaf0fb}
.sh2{font-size:11px;color:#d0cec5;cursor:grab;padding:0 2px;flex-shrink:0;user-select:none}
.sch{width:13px;height:13px;border-radius:3px;border:1.5px solid #d0cec5;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;background:#fff}
.sch.dc{background:#2a6b4a;border-color:#2a6b4a}
.sch.dc::after{content:'✓';font-size:9px;color:#fff;font-weight:700}
.snm{font-size:11px;color:#6b6960;flex:1}.snm.dt{text-decoration:line-through;color:#a8a49c}
.sej{font-size:10px;color:#a8a49c;background:none;border:none;cursor:pointer;padding:1px 4px;border-radius:3px;flex-shrink:0;display:none}
.srow:hover .sej{display:block}.sej:hover{color:#2355b0;background:#eaf0fb}
.sdue{font-size:10px;color:#a8a49c;flex-shrink:0;margin-left:2px}
.sdue.od{color:#c0392b;font-weight:600}
.theme-btn{position:fixed;bottom:20px;right:20px;width:42px;height:42px;border-radius:50%;border:none;background:#1c1b18;color:#fff;font-size:18px;cursor:pointer;box-shadow:0 3px 12px rgba(0,0,0,.25);z-index:100;display:flex;align-items:center;justify-content:center;transition:transform .2s}
.theme-btn:hover{transform:scale(1.1) rotate(15deg)}
.theme-panel{position:fixed;bottom:72px;right:16px;background:#fff;border:1px solid #e4e2da;border-radius:14px;padding:1rem;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:100;width:230px;display:none}
.theme-panel.open{display:block}
.theme-panel h4{font-size:11px;color:#a8a49c;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
.theme-swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:10px}
.theme-sw{width:34px;height:34px;border-radius:9px;cursor:pointer;border:2px solid transparent;transition:all .15s}
.theme-sw:hover{transform:scale(1.1)}
.theme-sw.sel{border-color:#1c1b18;box-shadow:0 0 0 1px #1c1b18}
.theme-custom{display:flex;align-items:center;gap:8px;border-top:1px solid #f0efe9;padding-top:9px;margin-top:2px}
.theme-custom label{font-size:11px;color:#6b6960;flex:1}
.theme-custom input[type=color]{width:34px;height:34px;border:none;border-radius:7px;cursor:pointer;padding:2px}
.sprog{display:flex;align-items:center;gap:5px;margin-bottom:4px}
.spbar{flex:1;height:3px;background:#f0efe9;border-radius:2px;overflow:hidden}
.spfill{height:100%;background:#2a6b4a;border-radius:2px}
.splbl{font-size:10px;color:#a8a49c;flex-shrink:0}
.cfoot{display:flex;flex-wrap:wrap;gap:3px;align-items:center;margin-top:4px}
.tag{font-size:10px;padding:1px 6px;border-radius:99px;font-weight:500;white-space:nowrap}
.tag-blue{background:#eaf0fb;color:#2355b0}.tag-amber{background:#fdf3e3;color:#c97b1a}
.tag-green{background:#e8f4ee;color:#2a6b4a}.tag-purple{background:#eeedfe;color:#3c3489}
.tag-gray{background:#f0efe9;color:#6b6960}
.dtag{font-size:10px;color:#a8a49c;display:flex;align-items:center;gap:2px;margin-left:auto}
.dtag.od{color:#c0392b;font-weight:600}
.acbtn{display:flex;align-items:center;gap:4px;font-size:11px;color:#a8a49c;background:none;border:none;cursor:pointer;padding:3px 2px;width:100%;font-family:inherit}
.acbtn:hover{color:#6b6960}
.emp{font-size:11px;color:#a8a49c;text-align:center;padding:18px 0;line-height:1.8}
.dh{font-size:10px;color:#a8a49c;text-align:center;margin-bottom:9px;padding:6px 10px;background:#fff;border-radius:8px;border:1px dashed #e4e2da}
.tz{display:flex;align-items:center;justify-content:center;gap:7px;padding:11px;border-radius:11px;border:2px dashed #e4e2da;background:#fff;color:#a8a49c;font-size:12px;min-height:50px;transition:all .2s}
.tz.tr{border-color:#c0392b;background:#fcecea;color:#c0392b}
.tz.th{border-color:#c0392b;background:#fcd9d6;color:#a00}
.ti{font-size:17px;transition:transform .2s}.tz.th .ti{transform:scale(1.2) rotate(-10deg)}
.gw{overflow-x:auto;background:#fff;border-radius:11px;padding:.875rem;border:1px solid #e4e2da}
.gantt{min-width:600px}
.ghdr{display:flex;margin-bottom:5px}
.glc{width:160px;flex-shrink:0;font-size:10px;color:#a8a49c;padding:0 6px}
.gday{text-align:center;font-size:10px;color:#a8a49c;border-left:1px solid #e4e2da;padding:2px 0}
.gday.td{color:#2355b0;font-weight:700;border-left:2px solid #2355b0}
.grow{display:flex;align-items:center;margin-bottom:5px;min-height:26px}
.glbl{width:160px;flex-shrink:0;font-size:11px;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;color:#6b6960}
.glbl:hover{color:#2355b0}
.gtrk{flex:1;position:relative;height:20px;background:#f0efe9;border-radius:4px}
.gbar{position:absolute;height:100%;border-radius:4px;display:flex;align-items:center;padding:0 7px;font-size:10px;color:#fff;white-space:nowrap;overflow:hidden;cursor:pointer;font-weight:500}
.gbar:hover{opacity:.85}
.gtl{position:absolute;top:-4px;bottom:-4px;width:2px;background:#2355b0;z-index:2;border-radius:1px}
.tpick{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.topt{font-size:11px;padding:2px 9px;border-radius:99px;cursor:pointer;border:1.5px solid transparent;font-weight:500;font-family:inherit}
.topt.sel{border-color:currentColor}
.ssec{margin-bottom:11px}
.ssec>label{font-size:10px;color:#a8a49c;display:block;margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.sle{margin-bottom:6px}
.ser{display:flex;align-items:center;gap:5px;margin-bottom:4px}
.ser input{flex:1;font-size:12px;padding:5px 8px;border:1px solid #e4e2da;border-radius:7px;outline:none;font-family:inherit}
.ser input:focus{border-color:#2355b0}
.sdb{background:none;border:none;cursor:pointer;color:#a8a49c;font-size:14px;padding:2px 5px;flex-shrink:0;line-height:1}
.sdb:hover{color:#c0392b}
.asb{display:flex;align-items:center;gap:5px;font-size:11px;color:#6b6960;background:none;border:1px dashed #d0cec5;border-radius:7px;padding:5px 9px;cursor:pointer;width:100%;font-family:inherit;font-weight:500}
.asb:hover{background:#f0efe9}
.err-box{background:#fcecea;border:1px solid #f5c6c2;border-radius:10px;padding:1.5rem;text-align:center;grid-column:1/-1}
.err-box h3{font-size:14px;color:#c0392b;margin-bottom:8px}
.err-box p{font-size:12px;color:#6b6960;line-height:1.6}
.err-box code{background:#f0efe9;padding:2px 6px;border-radius:4px;font-size:11px}
.tl-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px;padding:8px 12px;background:#fff;border-radius:10px;border:1px solid #e4e2da}
.tl-wrap{overflow-x:auto;overflow-y:auto;background:#fff;border-radius:12px;border:1px solid #e4e2da;position:relative;min-height:300px;max-height:75vh}
.tl-header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #e4e2da;display:flex;min-width:max-content}
.tl-header-label{width:180px;flex-shrink:0;padding:8px 12px;font-size:10px;color:#a8a49c;font-weight:600;text-transform:uppercase;letter-spacing:.05em;border-right:1px solid #e4e2da}
.tl-days{display:flex;flex:1}
.tl-day{min-width:36px;text-align:center;padding:6px 0;font-size:10px;color:#a8a49c;border-left:1px solid #f0efe9;flex-shrink:0}
.tl-day.today{color:#2355b0;font-weight:700;background:#f0f4ff;border-left:2px solid #2355b0}
.tl-body{position:relative;min-width:max-content}
.tl-svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:5}
.tl-row{display:flex;align-items:center;border-bottom:1px solid #f0efe9;min-height:52px;position:relative}
.tl-row:hover{background:#fafaf8}
.tl-row-label{width:180px;flex-shrink:0;padding:6px 12px;font-size:11px;color:#6b6960;border-right:1px solid #e4e2da;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.tl-row-label:hover{color:#2355b0}
.tl-row-track{flex:1;position:relative;height:52px}
.tl-cell{position:absolute;top:0;bottom:0;min-width:36px;border-left:1px solid #f0efe9}
.tl-cell.today{border-left:2px solid #2355b0;background:rgba(35,85,176,.04)}
.tl-bar{position:absolute;top:10px;height:32px;border-radius:8px;display:flex;align-items:center;padding:0 10px;font-size:11px;font-weight:500;color:#fff;cursor:pointer;transition:opacity .15s;white-space:nowrap;overflow:hidden;user-select:none;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.tl-bar:hover{opacity:.88}
.tl-bar.dep-source{box-shadow:0 0 0 2px #c97b1a,0 2px 6px rgba(0,0,0,.12)}
.tl-connector{position:absolute;top:50%;right:-6px;transform:translateY(-50%);width:12px;height:12px;border-radius:50%;background:#c97b1a;cursor:crosshair;z-index:20;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.tl-connector:hover{transform:translateY(-50%) scale(1.4)}
.tl-no-date{font-size:11px;color:#a8a49c;text-align:center;padding:1rem;grid-column:1/-1}
@media(max-width:640px){.board{grid-template-columns:1fr}.mets{grid-template-columns:repeat(2,1fr)}.pgrid{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- HOME -->
<div class="screen active" id="s-home">
  <div class="hw">
    <div class="hh">
      <div>
        <div class="brand">🗂 Task Board</div>
        <div class="brand-sub"><span id="conn-badge" class="conn-badge loading">⏳ connecting to Firebase...</span></div>
      </div>
      <button class="btn btn-p" onclick="openNPM()">＋ New project</button>
    </div>
    <div class="pgrid" id="pgrid">
      <div style="grid-column:1/-1;text-align:center;padding:2rem;color:#a8a49c;font-size:12px">กำลังเชื่อมต่อ Firebase...</div>
    </div>
  </div>
</div>

<!-- BOARD -->
<div class="screen" id="s-board">
  <div class="bw">
    <div class="btop">
      <button class="backbtn" onclick="goHome()">← Projects</button>
      <div class="bpname"><div class="pcdot" id="bdot"></div><span id="btitle"></span></div>
      <button class="btn btn-g" onclick="openModal(null,'todo')">＋ เพิ่ม</button>
      <button class="btn btn-g" onclick="doExport()">⬇ Export</button>
      <button class="savebtn sav" id="sbtn" onclick="saveNow()" disabled>✓ Saved</button>
    </div>
    <div class="sbar" id="sbar"></div>
    <div class="mets" id="mets"></div>
    <div class="pwrap">
      <div class="plbl"><span>ความคืบหน้า</span><span id="ppct">0%</span></div>
      <div class="pbar2"><div class="pfill" id="pfill" style="width:0%"></div></div>
    </div>
    <div class="tabs">
      <button class="tab act" onclick="setView('board')">📋 Board</button>
      <button class="tab" onclick="setView('gantt')">📅 Gantt</button>
      <button class="tab" onclick="setView('timeline')">🔗 Timeline</button>
    </div>
    <div id="v-board">
      <div class="dh">ลากข้าม column · ลากทับกัน → sub-task · ↗ ดึง sub-task ออก · ลากลง 🗑 → ลบ</div>
      <div class="fbar">
        <button class="fc act" onclick="setF('all')">ทั้งหมด</button>
        <button class="fc" onclick="setF('overdue')" style="color:#c0392b">⚠ Overdue</button>
        <button class="fc" onclick="setF('ICR')">ICR</button>
        <button class="fc" onclick="setF('LGD')">LGD</button>
        <button class="fc" onclick="setF('PD')">PD</button>
        <button class="fc" onclick="setF('FWL')">FWL</button>
        <button class="fc" onclick="setF('อื่นๆ')">อื่นๆ</button>
      </div>
      <div class="bwrap2">
        <div class="board" id="board"></div>
        <div class="tz" id="tz" ondragover="onTDO(event)" ondragleave="onTDL(event)" ondrop="onTDrop(event)">
          <span class="ti">🗑</span><span id="tlbl">ลากการ์ดมาวางที่นี่เพื่อลบ</span>
        </div>
      </div>
    </div>

// ── State ──
let projs=[],pid=null,tasks=[];

// ── Helpers ──
function e(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function SS(id){document.querySelectorAll('.screen').forEach(el=>{el.classList.remove('active');el.style.display='none';});const el=document.getElementById(id);if(el){el.classList.add('active');el.style.display='block';}}
function setStatus(m){const el=document.getElementById('sbar');if(el)el.textContent=m;}
function setBadge(cls,txt){const b=document.getElementById('conn-badge');if(b){b.className='conn-badge '+cls;b.textContent=txt;}}

// ── Firebase CRUD ──
async function fbGet(path){try{const s=await get(ref(db,path));return s.exists()?s.val():null;}catch(x){return null;}}
async function fbSet(path,val){try{await set(ref(db,path),val);return true;}catch(x){console.error(x);return false;}}
async function loadTasks(id){const r=await fbGet('tasks/'+id);if(!r)return[];return Object.values(r).map(t=>({...t,subs:t.subs||[]}));}
async function saveTasks(id,arr){const o={};arr.forEach(t=>{o[t.id]=t;});return fbSet('tasks/'+id,o);}
async function saveProjs(){const o={};projs.forEach(p=>{o[p.id]=p;});return fbSet('projects',o);}

// ── Init ──
async function init(){
  setBadge('loading','⏳ connecting...');
  try{
    await set(ref(db,'_ping'),Date.now());
    setBadge('ok','🟢 Firebase connected');
    // Load global theme
    const savedTheme=await fbGet('settings/global/theme');
    if(savedTheme){curTheme=savedTheme;applyTheme(savedTheme);}
  }catch(x){
    setBadge('err','🔴 connection failed');
    document.getElementById('pgrid').innerHTML=`<div class="err-box">
      <h3>❌ เชื่อมต่อ Firebase ไม่ได้</h3>
      <p>ต้องแก้ Firebase Rules ก่อนครับ<br><br>
      ไปที่ Firebase Console → <strong>Realtime Database → Rules</strong><br>
      แล้วเปลี่ยนเป็น:<br><br>
      <code>{ "rules": { ".read": true, ".write": true } }</code><br><br>
      แล้ว Publish และ reload หน้านี้ครับ</p>
    </div>`;
    return;
  }
  const raw=await fbGet('projects');
  if(raw){
    projs=Object.values(raw);
  }else{
    projs=[...SEED_PROJS];
    const o={};projs.forEach(p=>{o[p.id]=p;});
    await fbSet('projects',o);
    for(const p of projs){
      const to={};(SEED_TASKS[p.id]||[]).forEach(t=>{to[t.id]=t;});
      await fbSet('tasks/'+p.id,to);
    }
    setStatus('สร้างข้อมูลตั้งต้นแล้ว');
  }
  renderHome();
}

// ── Home ──
async function renderHome(){
  const counts=await Promise.all(projs.map(async p=>{
    const t=await loadTasks(p.id);
    return{tot:t.length,dn:t.filter(x=>x.col==='done').length,ip:t.filter(x=>x.col==='inprog').length,pct:t.length?Math.round(t.filter(x=>x.col==='done').length/t.length*100):0};
  }));
  const grid=document.getElementById('pgrid');
  if(!projs.length){grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:3rem;color:#a8a49c"><div style="font-size:32px;opacity:.4;margin-bottom:10px">📂</div><p>ยังไม่มี project</p></div>';return;}
  grid.innerHTML=projs.map((p,i)=>{
    const{tot,dn,ip,pct}=counts[i];
    return`<div class="pcard" onclick="openP('${p.id}')">
      <div class="pbar" style="background:${p.color}"></div>
      <div class="pname">${e(p.name)}</div>
      <div class="pdesc">${e(p.desc||'')}</div>
      <div class="pmeta">
        <div class="pst"><span class="pdot" style="background:${p.color}"></span>${tot} งาน</div>
        <div class="pst"><span class="pdot" style="background:#c97b1a"></span>${ip} ทำอยู่</div>
        <div class="pst"><span class="pdot" style="background:#2a6b4a"></span>${dn} เสร็จ ${pct}%</div>
      </div>
      <button class="pmenu" onclick="openEPM(event,'${p.id}')">⋯</button>
    </div>`;
  }).join('')+`<div class="newpcard" onclick="openNPM()"><span style="font-size:18px">＋</span><span>New project</span></div>`;
}

async function openP(id){
  pid=id;const p=projs.find(x=>x.id===id);if(!p)return;
  tasks=await loadTasks(id);
  document.getElementById('btitle').textContent=p.name;
  document.getElementById('bdot').style.background=p.color;
  SS('s-board');af='all';cv='board';dirty=false;pids=new Set();markSav();
  document.querySelectorAll('.tab').forEach(el=>{const m=el.getAttribute('onclick')&&el.getAttribute('onclick').match(/setView\('(\w+)'\)/);if(m)el.classList.toggle('act',m[1]==='board');});
  document.getElementById('v-board').style.display='';document.getElementById('v-gantt').style.display='none';
  document.querySelectorAll('.fc').forEach(el=>{const m=el.getAttribute('onclick')&&el.getAttribute('onclick').match(/setF\('(.+?)'\)/);if(m)el.classList.toggle('act',m[1]==='all');});
  setStatus('โหลดแล้ว · '+new Date().toLocaleString('th-TH',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}));
  loadDeps(id);
  const projTheme=await fbGet('settings/'+id+'/theme');
  if(projTheme){curTheme=projTheme;applyTheme(projTheme);}
  renderBoard();
}
window.openP=openP;
window.goHome=function(){SS('s-home');pid=null;tasks=[];renderHome();}

// ── Project Modal ──
window.openNPM=function(){epid=null;sc=PC[0];showPM(null);}
window.openEPM=function(ev,id){ev.stopPropagation();epid=id;const p=projs.find(x=>x.id===id);if(!p)return;sc=p.color||PC[0];showPM(p);}
function showPM(p){

    ${p?`<div class="cpanel" id="delpanel" style="display:none"><p>ลบ "<strong>${e(p.name)}</strong>"?</p><div class="crow"><button class="cdel" onclick="delP('${p.id}')">ลบเลย</button><button class="ccan" onclick="document.getElementById('delpanel').style.display='none'">ยกเลิก</button></div></div>`:''}

window.pickC=function(c){sc=c;const sw=PC.map(cc=>`<div class="csw${sc===cc?' sel':''}" style="background:${cc}" onclick="pickC('${cc}')"></div>`).join('');const cp=document.getElementById('cpick');if(cp)cp.innerHTML=sw;}
window.savPM=async function(){
  const n=document.getElementById('pm-n')?.value.trim();if(!n)return;
  const d=document.getElementById('pm-d')?.value.trim()||'';
  if(epid){const p=projs.find(x=>x.id===epid);if(p){p.name=n;p.desc=d;p.color=sc;}}
  else{const id='proj_'+Date.now();projs.push({id,name:n,desc:d,color:sc,at:Date.now()});await saveTasks(id,[]);}
  await saveProjs();cM();renderHome();
}
window.delP=async function(id){projs=projs.filter(x=>x.id!==id);await fbSet('tasks/'+id,null);await saveProjs();cM();renderHome();}

// ── Board ──
function isOD(d){return d&&new Date(d)<new Date(new Date().toDateString());}
function fmtD(d){return d?new Date(d).toLocaleDateString('th-TH',{day:'numeric',month:'short'}):''}
function tc(t){return'tag tag-'+(TC[t]||'gray')}
function filt(col){return tasks.filter(t=>{if(t.col!==col)return false;if(af==='all')return true;if(af==='overdue')return isOD(t.due);return(t.tags||[]).includes(af);});}
function markDirty(id){dirty=true;if(id)pids.add(id);const b=document.getElementById('sbtn');if(b){b.disabled=false;b.className='savebtn uns';b.innerHTML='<span class="udot"></span> Save';}}
function markSav(){dirty=false;pids.clear();const b=document.getElementById('sbtn');if(b){b.disabled=true;b.className='savebtn sav';b.innerHTML='✓ Saved';}}
window.saveNow=async function(){
  if(!dirty||!pid)return;
  const ok=await saveTasks(pid,tasks);
  if(ok){setStatus('บันทึกลง Firebase แล้ว · '+new Date().toLocaleString('th-TH',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}));markSav();renderBoard();}
  else setStatus('❌ บันทึกไม่สำเร็จ — ตรวจสอบ Firebase Rules');
}
window.doExport=function(){
  const b=new Blob([JSON.stringify(tasks,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  const p=projs.find(x=>x.id===pid);
  a.download=(p?p.name.replace(/\s+/g,'_'):'tasks')+'_'+new Date().toISOString().slice(0,10)+'.json';a.click();
}
window.setView=function(v){cv=v;document.getElementById('v-board').style.display=v==='board'?'':'none';document.getElementById('v-gantt').style.display=v==='gantt'?'':'none';document.getElementById('v-timeline').style.display=v==='timeline'?'':'none';document.querySelectorAll('.tab').forEach(el=>{const m=el.getAttribute('onclick')&&el.getAttribute('onclick').match(/setView\('(\w+)'\)/);if(m)el.classList.toggle('act',m[1]===v);});if(v==='gantt')renderGantt();else if(v==='timeline')renderTimeline();else renderBoard();}
window.setF=function(f){af=f;document.querySelectorAll('.fc').forEach(el=>{const m=el.getAttribute('onclick')&&el.getAttribute('onclick').match(/setF\('(.+?)'\)/);if(m)el.classList.toggle('act',m[1]===f);});renderBoard();}
function renderMets(){
  const tot=tasks.length,dn=tasks.filter(t=>t.col==='done').length,ip=tasks.filter(t=>t.col==='inprog').length,od=tasks.filter(t=>t.col!=='done'&&isOD(t.due)).length,pct=tot?Math.round(dn/tot*100):0;
  document.getElementById('mets').innerHTML=[[tot,'ทั้งหมด',''],[ip,'กำลังทำ','#c97b1a'],[dn,'เสร็จ','#2a6b4a'],[od,'Overdue','#c0392b']].map(([n,l,c])=>`<div class="met"><div class="mnum"${c?` style="color:${c}"`:''}>${n}</div><div class="mlbl">${l}</div></div>`).join('');
  document.getElementById('pfill').style.width=pct+'%';document.getElementById('ppct').textContent=pct+'%';
}
function renderBoard(){
  renderMets();
  document.getElementById('board').innerHTML=COLS.map(col=>{
    const ct=filt(col.id);
    return`<div class="col" id="col-${col.id}" ondragover="onCO(event,'${col.id}')" ondragleave="onCL(event,'${col.id}')" ondrop="onCD(event,'${col.id}')">
      <div class="colh"><span class="coltit" style="color:${col.color}">${col.icon} ${col.label}</span><span class="colcnt">${ct.length}</span></div>
      <div class="coldl">วางที่นี่ → ${col.label}</div>
      ${ct.length===0?`<div class="emp">ไม่มีงาน<br><small style="opacity:.5">ลากการ์ดมาวาง</small></div>`:''}
      ${ct.map(t=>cardH(t)).join('')}
      ${col.id!=='done'?`<button class="acbtn" onclick="openModal(null,'${col.id}')">＋ เพิ่มงาน</button>`:''}
    </div>`;
  }).join('');
}
function cardH(t){
  const od=t.col!=='done'&&isOD(t.due),subs=t.subs||[],sd2=subs.filter(s=>s.done).length,st=subs.length,sp=st?Math.round(sd2/st*100):0;
  const sr=subs.map(s=>{const sod=s.due&&!s.done&&isOD(s.due);return`<div class="srow" id="sr-${s.id}" draggable="true" ondragstart="onSDS(event,'${t.id}','${s.id}')" ondragend="onSDE(event,'${s.id}')" ondragover="onSDO(event,'${t.id}','${s.id}')" ondragleave="onSDL('${s.id}')" ondrop="onSDD(event,'${t.id}','${s.id}')"><span class="sh2">⠿</span><div class="sch${s.done?' dc':''}" onclick="togSub('${t.id}','${s.id}',event)"></div><span class="snm${s.done?' dt':''}">${e(s.name)}</span>${s.due?`<span class="sdue${sod?' od':''}">${sod?'⚠':'📅'} ${fmtD(s.due)}</span>`:''}<button class="sej" onclick="ejectS('${t.id}','${s.id}',event)">↗</button></div>`;}).join('');
  return`<div class="card${od?' od':''}${pids.has(t.id)?' pen':''}" id="c-${t.id}" draggable="true" ondragstart="onDS(event,'${t.id}')" ondragend="onDE(event,'${t.id}')" ondragover="onDO(event,'${t.id}')" ondragleave="onDL(event,'${t.id}')" ondrop="onDD(event,'${t.id}')" onclick="openModal('${t.id}','${t.col}')">
    <div class="cname">${e(t.name)}</div>
    ${st>0?`<div class="sprog"><div class="spbar"><div class="spfill" style="width:${sp}%"></div></div><span class="splbl">${sd2}/${st}</span></div><div class="csubs" onclick="event.stopPropagation()">${sr}</div>`:''}
    <div class="cfoot">${(t.tags||[]).map(tg=>`<span class="${tc(tg)}">${tg}</span>`).join('')}${t.due?`<span class="dtag${od?' od':''}">📅 ${fmtD(t.due)}${od?' ⚠':''}</span>`:''}</div>
  </div>`;
}

  const dues=allItems.map(t=>new Date(t.due));let mn=new Date(Math.min(...dues)),mx=new Date(Math.max(...dues));
  mn.setDate(mn.getDate()-3);mx.setDate(mx.getDate()+3);

  const days=[];for(let i=0;i<td;i++){const d=new Date(mn);d.setDate(mn.getDate()+i);days.push(d);}
  const ti=days.findIndex(d=>d.getTime()===tdy.getTime()),dw=100/td;
  const hdr=days.map((d,i)=>{const it=d.getTime()===tdy.getTime();const lb=i===0||d.getDate()===1||it?d.toLocaleDateString('th-TH',{day:'numeric',month:'short'}):'';return`<div class="gday${it?' td':''}" style="flex:0 0 ${dw}%;min-width:${dw}%">${lb}</div>`;}).join('');
  const tl=ti>=0?`<div style="position:absolute;left:${ti*dw+dw/2}%;top:0;bottom:0;width:2px;background:#2355b0;border-radius:1px;z-index:2"></div>`:'';

    return`<div class="grow"><div class="glbl" title="${t.isSub?t.parentName+' > ':''} ${e(t.name)}" style="${glblStyle}" onclick="${clickFn}">${label}</div><div class="gtrk">${itl}<div class="gbar" style="left:${lft}%;width:${wid}%;background:${bc};${t.isSub?'height:14px;top:3px;font-size:9px':''}" onclick="${clickFn}">${fmtD(t.due)}</div></div></div>`;
  }).join('');
  document.getElementById('gantt').innerHTML=`<div class="ghdr"><div class="glc">งาน <span style="font-size:9px;color:#a8a49c;font-style:italic">(↳ = sub-task)</span></div><div style="flex:1;position:relative;display:flex">${tl}${hdr}</div></div><div style="border-top:1px solid #e4e2da;margin-bottom:9px"></div>${rows}`;

function renderTimeline(){
  renderMets();
  // Include sub-tasks with due dates
  const allTlItems=[];
  tasks.forEach(t=>{
    if(t.due)allTlItems.push({id:t.id,name:t.name,due:t.due,col:t.col,isSub:false,tid:t.id,done:false});
    (t.subs||[]).forEach(s=>{
      if(s.due)allTlItems.push({id:'sub_'+s.id,name:s.name,due:s.due,col:t.col,isSub:true,tid:t.id,done:s.done,parentName:t.name});
    });
  });
  const hasDue=allTlItems;
  const wrap=document.getElementById('tl-wrap');
  const hdr=document.getElementById('tl-header');
  const body=document.getElementById('tl-body');
  const svg=document.getElementById('tl-svg');
  if(!wrap||!hdr||!body||!svg)return;

  if(!hasDue.length){
    body.innerHTML='<div class="tl-no-date" style="padding:2rem;color:#a8a49c;text-align:center">ยังไม่มีงานที่มี due date<br><small>เพิ่ม due date ในการ์ดงานก่อนครับ</small></div>';
    hdr.innerHTML='';svg.innerHTML='';return;
  }

  const dues=allTlItems.map(t=>new Date(t.due));
  let minD=new Date(Math.min(...dues)), maxD=new Date(Math.max(...dues));
  minD.setDate(minD.getDate()-4);maxD.setDate(maxD.getDate()+4);
  const totalDays=Math.max(20,Math.round((maxD-minD)/86400000)+1);
  const today=new Date(new Date().toDateString());
  const days=[];
  for(let i=0;i<totalDays;i++){const d=new Date(minD);d.setDate(minD.getDate()+i);days.push(d);}
  const DAY_W=36; // px per day
  const LABEL_W=180;
  const totalW=LABEL_W+days.length*DAY_W;

  // Header
  const dayHtml=days.map(d=>{
    const isT=d.getTime()===today.getTime();
    const lbl=(d.getDate()===1||isT)?d.toLocaleDateString('th-TH',{day:'numeric',month:'short'}):(d.getDay()===0?d.getDate():'');
    return`<div class="tl-day${isT?' today':''}" style="min-width:${DAY_W}px">${lbl}</div>`;
  }).join('');
  hdr.innerHTML=`<div class="tl-header-label">งาน</div><div class="tl-days">${dayHtml}</div>`;

  // Rows
  const sorted=[...allTlItems].sort((a,b)=>new Date(a.due)-new Date(b.due));
  const rowH=52;

  // cells background
  const cellsHtml=days.map((d,i)=>{
    const isT=d.getTime()===today.getTime();
    return`<div class="tl-cell${isT?' today':''}" style="left:${i*DAY_W}px;width:${DAY_W}px"></div>`;
  }).join('');

  const rowsHtml=sorted.map((t,ri)=>{
    const dueD=new Date(t.due);
    const di=days.findIndex(d=>d.getTime()===dueD.getTime());
    if(di<0)return'';
    const startI=Math.max(0,di-2);
    const barLeft=LABEL_W+startI*DAY_W;
    const barW=Math.max(DAY_W*3,(di-startI+1)*DAY_W);
    const od=!t.done&&isOD(t.due);
    let bc=od?'#c0392b':(CC[t.col]||'#b0ada6');
    if(t.isSub)bc=od?'#e07070':bc+'cc';
    const clickFn=t.isSub?`openModal('${t.tid}','${t.col}')`:`openModal('${t.id}','${t.col}')`;
    const lblPrefix=t.isSub?'<span style="color:#bbb;margin-right:4px">↳</span>':'';
    // Click-to-connect mode: click connector dot OR alt+click bar
    return`<div class="tl-row" id="tlrow-${t.id}" data-tid="${t.id}"
      ondragover="onTLDragOver(event,'${t.id}')"
      ondragleave="onTLDragLeave(event,'${t.id}')"
      ondrop="onTLDrop(event,'${t.id}')"
      onclick="onTLRowClick(event,'${t.id}')">
      <div class="tl-row-label" onclick="if(!tlConnMode){${clickFn}}" title="${t.isSub?(t.parentName||'')+' > ':''} ${e(t.name)}" style="${t.isSub?'padding-left:20px;':''}">
        ${lblPrefix}${e(t.name.length>22?t.name.slice(0,22)+'…':t.name)}
      </div>
      <div class="tl-row-track" style="width:${days.length*DAY_W}px;position:relative">
        ${cellsHtml}
        <div class="tl-bar" id="tlbar-${t.id}"
          style="left:${barLeft-LABEL_W}px;width:${barW}px;background:${bc};${t.isSub?'top:14px;height:24px;font-size:10px;opacity:0.85':''}"
          title="${e(t.name)} — ${fmtD(t.due)}">
          ${e(t.name.length>18?t.name.slice(0,18)+'…':t.name)}
          <div class="tl-connector"
            draggable="true"
            ondragstart="onTLConnStart(event,'${t.id}')"
            ondragend="onTLConnEnd(event)"
            onclick="event.stopPropagation();onTLConnClick('${t.id}')"
            title="คลิก หรือ ลาก เพื่อเชื่อมกับงานอื่น">
            <svg width="8" height="8" viewBox="0 0 8 8"><circle cx="4" cy="4" r="3" fill="white" opacity="0.9"/></svg>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');

  body.innerHTML=`<div style="position:relative;min-width:${totalW}px">${rowsHtml}</div>`;

  // Reattach SVG
  const newSvg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  newSvg.id='tl-svg';newSvg.className='tl-svg';newSvg.style.cssText='position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:5';
  body.querySelector('div').appendChild(newSvg);

  drawDepArrows();
}

function drawDepArrows(){
  const svg=document.getElementById('tl-svg');if(!svg)return;
  svg.innerHTML='';
  const defs=document.createElementNS('http://www.w3.org/2000/svg','defs');
  const marker=document.createElementNS('http://www.w3.org/2000/svg','marker');
  marker.setAttribute('id','arr');marker.setAttribute('markerWidth','8');marker.setAttribute('markerHeight','8');
  marker.setAttribute('refX','6');marker.setAttribute('refY','3');marker.setAttribute('orient','auto');
  const poly=document.createElementNS('http://www.w3.org/2000/svg','polygon');
  poly.setAttribute('points','0 0, 6 3, 0 6');poly.setAttribute('fill','#c97b1a');
  marker.appendChild(poly);defs.appendChild(marker);svg.appendChild(defs);

  Object.entries(deps).forEach(([fromId,toIds])=>{
    (toIds||[]).forEach(toId=>{
      const fromBar=document.getElementById('tlbar-'+fromId);
      const toBar=document.getElementById('tlbar-'+toId);
      if(!fromBar||!toBar)return;
      const container=svg.parentElement;
      const cRect=container.getBoundingClientRect();
      const fRect=fromBar.getBoundingClientRect();
      const tRect=toBar.getBoundingClientRect();
      const x1=fRect.right-cRect.left+container.scrollLeft;
      const y1=fRect.top-cRect.top+container.scrollTop+fRect.height/2;
      const x2=tRect.left-cRect.left+container.scrollLeft;
      const y2=tRect.top-cRect.top+container.scrollTop+tRect.height/2;
      const cx=(x1+x2)/2;
      const path=document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('d',`M${x1},${y1} C${cx},${y1} ${cx},${y2} ${x2},${y2}`);
      path.setAttribute('stroke','#c97b1a');path.setAttribute('stroke-width','2.5');
      path.setAttribute('fill','none');path.setAttribute('marker-end','url(#arr)');
      path.setAttribute('stroke-dasharray','6,3');path.style.pointerEvents='stroke';path.style.cursor='pointer';
      path.setAttribute('title',`คลิกขวาเพื่อลบเส้นเชื่อม ${fromId} → ${toId}`);
      path.addEventListener('contextmenu',function(ev){ev.preventDefault();if(confirm('ลบเส้นเชื่อมนี้?'))removeDep(fromId,toId);});
      path.addEventListener('mouseenter',function(){path.setAttribute('stroke','#e05c3a');path.setAttribute('stroke-width','4');});
      path.addEventListener('mouseleave',function(){path.setAttribute('stroke','#c97b1a');path.setAttribute('stroke-width','2.5');});
      svg.appendChild(path);
    });
  });
}

let tlConnMode=false; // click mode: first click selects source, second click selects target

function setTLConnMode(active,fromId){
  tlConnMode=active;

  const hint=document.getElementById('tl-hint');
  if(hint){
    if(active)hint.textContent=`🔗 เลือก "${fromId}" → คลิกงานที่จะเชื่อมต่อ (กด Esc ยกเลิก)`;

  }
  document.querySelectorAll('.tl-row').forEach(r=>{

  const fromId=tlConnFromId;
  tlConnFromId=null;
  setTLConnMode(false,'');
  document.querySelectorAll('.tl-bar').forEach(b=>b.classList.remove('dep-source'));
  document.querySelectorAll('.tl-row').forEach(r=>{r.style.background='';r.style.cursor='';});
  if(!deps[fromId])deps[fromId]=[];
  if(!deps[fromId].includes(toId)){
    deps[fromId].push(toId);
    await saveDeps(pid);
    drawDepArrows();
  }
}
document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape'&&tlConnMode){
    tlConnFromId=null;
    setTLConnMode(false,'');
    document.querySelectorAll('.tl-bar').forEach(b=>b.classList.remove('dep-source'));
    document.querySelectorAll('.tl-row').forEach(r=>{r.style.background='';r.style.cursor='';});
    if(tlDragging){document.getElementById('tlbar-'+tlDragging)?.classList.remove('dep-source');tlDragging=null;}
  }
});

// Drag connect (still supported)
window.onTLConnStart=function(ev,tid){
  if(tlConnMode){ev.preventDefault();return;}
  tlDragging=tid;
  ev.dataTransfer.setData('text/plain',tid);
  ev.dataTransfer.effectAllowed='link';
  document.getElementById('tlbar-'+tid)?.classList.add('dep-source');
  ev.stopPropagation();
}
window.onTLConnEnd=function(ev){
  if(tlDragging)document.getElementById('tlbar-'+tlDragging)?.classList.remove('dep-source');
  tlDragging=null;
  document.querySelectorAll('.tl-row').forEach(r=>{r.style.background='';r.style.cursor='';});
}
window.onTLDragOver=function(ev,tid){
  if(!tlDragging||tlDragging===tid)return;
  ev.preventDefault();
  document.getElementById('tlrow-'+tid).style.background='#eaf0fb';
}
window.onTLDragLeave=function(ev,tid){
  if(!tlConnMode)document.getElementById('tlrow-'+tid).style.background='';
}
window.onTLDrop=async function(ev,toId){
  ev.preventDefault();
  if(!tlConnMode)document.getElementById('tlrow-'+toId).style.background='';
  if(!tlDragging||tlDragging===toId)return;
  const fromId=tlDragging;tlDragging=null;
  document.getElementById('tlbar-'+fromId)?.classList.remove('dep-source');
  if(!deps[fromId])deps[fromId]=[];
  if(!deps[fromId].includes(toId)){
    deps[fromId].push(toId);
    await saveDeps(pid);
    drawDepArrows();
  }
}
// Remove single dep by clicking arrow (right-click)
window.removeDep=async function(fromId,toId){
  if(!deps[fromId])return;
  deps[fromId]=deps[fromId].filter(x=>x!==toId);
  await saveDeps(pid);
  drawDepArrows();
}

// ── Theme ──
const THEMES=[
  {color:'#f6f5f2',label:'Cream (default)'},
  {color:'#ffffff',label:'White'},
  {color:'#f0f4f8',label:'Cool Blue'},
  {color:'#f0f7f0',label:'Mint'},
  {color:'#fdf4e3',label:'Warm Sand'},
  {color:'#f5f0f8',label:'Lavender'},
  {color:'#1a1a2e',label:'Dark Navy'},
  {color:'#0d1117',label:'Dark'},
  {color:'#1e1e1e',label:'Charcoal'},
  {color:'#2d1b3d',label:'Deep Purple'},
];
let curTheme='#f6f5f2'; // loaded from Firebase on init

function applyTheme(color){
  curTheme=color;
  // Detect if dark color
  const isDark=isDarkColor(color);
  document.documentElement.style.setProperty('--bg',color);
  document.body.style.background=color;
  document.body.style.color=isDark?'#e8e6e3':'#1c1b18';
  // Update card/col backgrounds for dark mode
  const lightness=isDark?'rgba(255,255,255,0.07)':'#fff';
  const surface2=isDark?'rgba(255,255,255,0.04)':'#f0efe9';
  const border=isDark?'rgba(255,255,255,0.12)':'#e4e2da';
  const textMuted=isDark?'#888':'#a8a49c';
  document.querySelectorAll('.card,.modal,.met,.pcard,.gw,.tl-wrap,.tl-toolbar,.dh,.tz,.tl-header,.theme-panel,.backbtn,.btn-g,.col,.pgrid .newpcard').forEach(el=>{
    if(el.classList.contains('col')){el.style.background=surface2;}
    else if(el.classList.contains('newpcard')){el.style.borderColor=isDark?'rgba(255,255,255,0.2)':'#d0cec5';}
    else{el.style.background=isDark?'rgba(255,255,255,0.07)':"";}
    if(isDark){el.style.borderColor='rgba(255,255,255,0.12)';el.style.color='#e8e6e3';}
    else{el.style.borderColor='';el.style.color='';}
  });
  localStorage.setItem('tb_theme',color); // fallback
  if(pid)fbSet('settings/'+pid+'/theme',color); else fbSet('settings/global/theme',color);
  const inp=document.getElementById('theme-custom-color');
  if(inp)inp.value=color;
  renderThemeSwatches();
}
function isDarkColor(hex){
  const h=hex.replace('#','');
  if(h.length<6)return false;
  const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
  return(0.299*r+0.587*g+0.114*b)<128;
}
function renderThemeSwatches(){
  const c=document.getElementById('theme-swatches');if(!c)return;
  c.innerHTML=THEMES.map(t=>`<div class="theme-sw${curTheme===t.color?' sel':''}" style="background:${t.color};border:1px solid #e4e2da" title="${t.label}" onclick="applyTheme('${t.color}')"></div>`).join('');
}
function toggleTheme(){
  const p=document.getElementById('theme-panel');
  if(p){p.classList.toggle('open');if(p.classList.contains('open'))renderThemeSwatches();}
}
document.addEventListener('click',function(e){
  const p=document.getElementById('theme-panel');
  const b=document.querySelector('.theme-btn');
  if(p&&b&&!p.contains(e.target)&&!b.contains(e.target))p.classList.remove('open');
});
applyTheme(curTheme);

init();
</script>
